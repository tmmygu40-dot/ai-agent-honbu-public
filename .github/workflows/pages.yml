# GitHub 公式 Deploy static content to Pages workflow
# https://github.com/actions/starter-workflows/blob/main/pages/static.yml
#
# 目的:
#   - dynamic Jekyll workflow の syncing_files 停止問題の恒久対策
#   - concurrency: pages で in-flight deployment 競合を排除（公式推奨）
#   - actions/deploy-pages@v4 使用（v5 の一時的な同期失敗を回避）
#   - Jekyll build を通さず静的ファイルそのまま upload（無用な処理排除）
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
